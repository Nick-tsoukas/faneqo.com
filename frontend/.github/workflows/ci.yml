name: Frontend CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: frontend-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    name: Focused tests and Nuxt build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NUXT_TELEMETRY_DISABLED: 1
      BASE_URL: https://faneqo.com
      STRAPI_URL: http://127.0.0.1:9
      STRIPE_PUBLISHABLE_KEY: pk_test_ci_only
      STRIPE_PUBLIC_KEY: pk_test_ci_only
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Run focused messaging, media, and Labs tests
        run: npm test

      - name: Build Nuxt application
        # Build even when a focused test fails, so every PR still proves the app builds
        if: ${{ !cancelled() }}
        run: npm run build
