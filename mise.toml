# Local host tooling only (npm run dev). Staging droplet / containers do not need mise.
# Source of truth for pins: root .env (from example.env). Do not hardcode Node versions here.
# Default PATH pin = NODE_VERSION; FE/BE overrides applied via mise exec in stack.config / package.json.

[env]
_.file = ".env"

[tools]
node = "{{ env.NODE_VERSION }}"
