# Deploy content-only staging branch to the DO droplet.
# Root CI must pass first (reusable workflow). Build runs ON the droplet — not the runner.
# Required repo secrets: STAGING_HOST, STAGING_USER, STAGING_SSH_PRIVATE_KEY
name: Deploy staging

on:
  push:
    branches:
      - staging
  workflow_dispatch:

concurrency:
  group: deploy-staging-droplet
  cancel-in-progress: false

jobs:
  root-test:
    name: Root CI gate
    uses: ./.github/workflows/root-ci.yml

  deploy:
    needs: root-test
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: SSH deploy to droplet
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.STAGING_HOST }}
          username: ${{ secrets.STAGING_USER }}
          key: ${{ secrets.STAGING_SSH_PRIVATE_KEY }}
          command_timeout: 40m
          script: |
            set -euo pipefail
            cd /opt/faneqo
            # Capture pre-deploy HEAD for selective FE/BE rebuild, then reset so
            # staging-droplet-deploy.sh exists even on older trees.
            PREV_SHA="$(git rev-parse HEAD)"
            git fetch origin
            git reset --hard "${{ github.sha }}"
            PREV_SHA="${PREV_SHA}" bash scripts/staging-droplet-deploy.sh "${{ github.sha }}"
